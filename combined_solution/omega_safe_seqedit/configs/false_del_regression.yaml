name: false_del_regression
seed: 47

paths:
  output_dir: outputs/false_del_regression

data:
  kind: synthetic
  synthetic_profile: false_del_regression
  num_train: 128
  num_val: 32
  num_test: 32
  read_length: 96
  support_depth: 3
  support_noise: 0.08
  include_neighbor_cases: true
  include_homopolymer_cases: true
  shared_examples_across_splits: false

model:
  d_model: 96
  num_layers: 2
  num_heads: 4
  dropout: 0.06
  max_len: 512
  use_support: true
  use_rule_features: true

train:
  epochs: 4
  batch_size: 8
  lr: 0.0008
  weight_decay: 0.00001
  hard_edit_weight: 3.0
  false_edit_penalty: 1.4
  support_rule_distill_weight: 0.8
  margin_weight: 0.6
  margin: 0.8
  ins_payload_weight: 1.4
  sub_payload_weight: 1.4
  device: auto

decode:
  mode: hybrid
  support_rule_agreement_threshold: 0.72
  support_rule_insertion_threshold: 0.72
  support_rule_deletion_threshold: 0.90
  rule_force_min_fraction:
    SUB: 0.88
    INS: 0.72
    DEL: 0.96
  rule_force_max_entropy:
    SUB: 0.80
    INS: 0.95
    DEL: 0.50
  neural_rescue_min_type_prob:
    SUB: 0.992
    INS: 0.992
    DEL: 0.999
  neural_rescue_min_payload_prob: 0.98
  rule_negative_veto: true
  neighbor_abstention: true
  neighbor_radius: 1
  neighbor_min_fraction: 0.97
  homopolymer_del_min_fraction: 0.99
  use_support_payload_for_insertions: true

acceptance_targets:
  full_hybrid:
    false_del_count_max: 0
    neighbor_induced_false_edits_max: 0
    homopolymer_false_del_count_max: 0

external_baselines: []
