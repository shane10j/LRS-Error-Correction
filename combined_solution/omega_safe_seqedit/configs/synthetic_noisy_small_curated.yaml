name: synthetic_noisy_small_curated
seed: 47

paths:
  output_dir: outputs/synthetic_noisy_small_curated

data:
  kind: synthetic
  synthetic_profile: noisy_curated
  num_train: 160
  num_val: 48
  num_test: 24
  read_length: 96
  support_depth: 3
  support_noise: 0.08
  include_neighbor_cases: true
  include_homopolymer_cases: true
  shared_examples_across_splits: false

model:
  d_model: 96
  num_layers: 2
  num_heads: 4
  dropout: 0.06
  max_len: 512
  use_support: true
  use_rule_features: true

train:
  epochs: 5
  batch_size: 8
  lr: 0.0008
  weight_decay: 0.00001
  hard_edit_weight: 3.0
  false_edit_penalty: 1.0
  support_rule_distill_weight: 0.8
  margin_weight: 0.5
  margin: 0.75
  ins_payload_weight: 1.6
  sub_payload_weight: 1.6
  device: auto

decode:
  mode: hybrid
  support_rule_agreement_threshold: 0.67
  support_rule_insertion_threshold: 0.67
  support_rule_deletion_threshold: 0.80
  rule_force_min_fraction:
    SUB: 0.80
    INS: 0.67
    DEL: 0.90
  rule_force_max_entropy:
    SUB: 0.95
    INS: 1.10
    DEL: 0.70
  neural_rescue_min_type_prob:
    SUB: 0.985
    INS: 0.985
    DEL: 0.997
  neural_rescue_min_payload_prob: 0.96
  rule_negative_veto: true
  neighbor_abstention: true
  neighbor_radius: 1
  neighbor_min_fraction: 0.90
  homopolymer_del_min_fraction: 0.96
  use_support_payload_for_insertions: true

acceptance_targets:
  full_hybrid:
    corrected_edits_min: 14
    false_edits_max: 0
    overcorrection_rate_max: 0.0

external_baselines: []
