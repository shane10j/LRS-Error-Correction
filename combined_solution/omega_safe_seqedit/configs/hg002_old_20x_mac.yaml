name: hg002_old_20x_mac
seed: 47

paths:
  output_dir: outputs/hg002_old_20x_mac

data:
  kind: old_jsonl
  sample: HG002
  coverage: 20x
  train_path: /Users/shanejayasundera/LRS-Error-Correction/old_solution/data/hg002_chr20_small_benchmark/hg002_chr20_primary_20x/chr20_small/train.jsonl
  val_path: /Users/shanejayasundera/LRS-Error-Correction/old_solution/data/hg002_chr20_small_benchmark/hg002_chr20_primary_20x/chr20_small/val.jsonl
  test_path: /Users/shanejayasundera/LRS-Error-Correction/old_solution/data/hg002_chr20_small_benchmark/hg002_chr20_primary_20x/chr20_small/test.jsonl
  reads_bam: /Users/shanejayasundera/LRS-Error-Correction/old_solution/data/subsets/hg002_chr20_20x/HG002.giab.subset.bam
  reference_fasta: /Users/shanejayasundera/LRS-Error-Correction/old_solution/data/raw/giab/hg002/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna
  truth_vcf: /Users/shanejayasundera/LRS-Error-Correction/old_solution/data/subsets/hg002_chr20_truth/HG002_chr20_benchmark.vcf.gz
  confident_bed: /Users/shanejayasundera/LRS-Error-Correction/old_solution/data/subsets/hg002_chr20_truth/HG002_chr20_confident.bed
  max_examples:
    train: 500
    val: 100
    test: 200

model:
  d_model: 96
  num_layers: 2
  num_heads: 4
  dropout: 0.08
  max_len: 4096
  use_support: true
  use_rule_features: true

train:
  epochs: 3
  batch_size: 2
  lr: 0.0005
  weight_decay: 0.00001
  hard_edit_weight: 3.0
  false_edit_penalty: 1.2
  support_rule_distill_weight: 0.7
  margin_weight: 0.5
  margin: 0.8
  ins_payload_weight: 1.5
  sub_payload_weight: 1.5
  device: auto

decode:
  mode: hybrid
  support_rule_agreement_threshold: 0.80
  support_rule_insertion_threshold: 0.85
  support_rule_deletion_threshold: 0.92
  rule_force_min_fraction:
    SUB: 0.90
    INS: 0.85
    DEL: 0.95
  rule_force_max_entropy:
    SUB: 0.75
    INS: 0.85
    DEL: 0.50
  neural_rescue_min_type_prob:
    SUB: 0.993
    INS: 0.993
    DEL: 0.999
  neural_rescue_min_payload_prob: 0.985
  rule_negative_veto: true
  neighbor_abstention: true
  neighbor_radius: 1
  neighbor_min_fraction: 0.96
  homopolymer_del_min_fraction: 0.985
  variant_aware_abstention: true
  variant_min_fraction: 0.985
  variant_max_entropy: 0.30
  repeat_aware_abstention: true
  repeat_min_fraction: 0.97
  repeat_max_entropy: 0.40
  strict_del_in_ambiguous_context: true
  ambiguous_del_min_fraction: 0.99
  force_support_sub: false
  sub_abstain_in_tandem_repeat: true
  sub_abstain_near_neighbor: true
  sub_abstain_in_variant_or_low_confidence: true
  sub_require_model_agreement: true
  sub_candidate_min_type_prob: 0.85
  sub_candidate_min_payload_prob: 0.92
  sub_candidate_min_fraction: 0.96
  sub_require_local_rerank: true
  sub_local_rerank_radius: 2
  sub_local_edit_penalty: 0.10
  sub_local_min_gain: 0.06
  sub_neighbor_density_penalty: 0.10
  allow_ambiguous_sub_with_strong_model_and_rerank: false
  safe_true_edit_recovery: false
  safe_recovery_edit_types: [SUB]
  safe_recovery_min_depth: 8
  safe_recovery_min_fraction: 0.99
  safe_recovery_min_margin: 6
  safe_recovery_max_entropy: 0.02
  safe_recovery_sub_min_type_prob: 0.45
  safe_recovery_sub_min_payload_prob: 0.80
  sub_recovery_require_allow_gate: true
  hard_veto_indels: true
  indel_require_allow_gate: true
  ins_top_base_min_fraction: 0.90
  ins_inserted_base_min_margin: 2
  del_hard_min_fraction: 0.96
  del_homopolymer_run_veto_min: 2
  del_veto_zero_base_support: true
  indel_local_rerank_in_ambiguous_context: true
  indel_local_rerank_radius: 2
  indel_local_edit_penalty: 0.06
  indel_local_min_gain: 0.18
  indel_neighbor_density_penalty: 0.08
  use_support_payload_for_insertions: true

external_baselines: []
