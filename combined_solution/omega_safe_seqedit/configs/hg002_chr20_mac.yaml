name: hg002_chr20_mac
seed: 47

paths:
  output_dir: outputs/hg002_chr20_mac

data:
  kind: real_bam
  bam: /path/to/HG002_chr20_subset.bam
  reference_fasta: /path/to/GRCh38.fa
  contig: chr20
  start: 10000000
  end: 10200000
  num_train: 1200
  num_val: 200
  num_test: 200
  window_length: 768
  max_support_reads: 12
  min_read_length: 10000
  truth_source: reference

model:
  d_model: 128
  num_layers: 3
  num_heads: 4
  dropout: 0.08
  max_len: 1024
  use_support: true
  use_rule_features: true

train:
  epochs: 5
  batch_size: 4
  lr: 0.0005
  weight_decay: 0.00001
  hard_edit_weight: 3.0
  false_edit_penalty: 1.2
  support_rule_distill_weight: 0.6
  margin_weight: 0.5
  margin: 0.75
  ins_payload_weight: 1.5
  sub_payload_weight: 1.5
  device: auto

decode:
  mode: hybrid
  support_rule_agreement_threshold: 0.75
  support_rule_insertion_threshold: 0.80
  support_rule_deletion_threshold: 0.88
  rule_force_min_fraction:
    SUB: 0.88
    INS: 0.80
    DEL: 0.92
  rule_force_max_entropy:
    SUB: 0.80
    INS: 0.90
    DEL: 0.60
  neural_rescue_min_type_prob:
    SUB: 0.992
    INS: 0.992
    DEL: 0.998
  neural_rescue_min_payload_prob: 0.98
  rule_negative_veto: true
  neighbor_abstention: true
  neighbor_radius: 1
  neighbor_min_fraction: 0.94
  homopolymer_del_min_fraction: 0.98
  use_support_payload_for_insertions: true

external_baselines: []
