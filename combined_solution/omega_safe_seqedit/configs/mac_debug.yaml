name: mac_debug
seed: 47

paths:
  output_dir: outputs/mac_debug

data:
  kind: synthetic
  num_train: 96
  num_val: 24
  num_test: 24
  read_length: 96
  support_depth: 6
  support_noise: 0.03
  include_neighbor_cases: true
  include_homopolymer_cases: true
  shared_examples_across_splits: false

model:
  d_model: 96
  num_layers: 2
  num_heads: 4
  dropout: 0.05
  max_len: 512
  use_support: true
  use_rule_features: true

train:
  epochs: 5
  batch_size: 8
  lr: 0.0008
  weight_decay: 0.00001
  hard_edit_weight: 3.0
  false_edit_penalty: 0.8
  support_rule_distill_weight: 0.8
  margin_weight: 0.5
  margin: 0.75
  ins_payload_weight: 1.5
  sub_payload_weight: 1.5
  device: auto

decode:
  mode: hybrid
  support_rule_agreement_threshold: 0.67
  support_rule_insertion_threshold: 0.67
  support_rule_deletion_threshold: 0.75
  rule_force_min_fraction:
    SUB: 0.80
    INS: 0.67
    DEL: 0.85
  rule_force_max_entropy:
    SUB: 0.95
    INS: 1.10
    DEL: 0.80
  neural_rescue_min_type_prob:
    SUB: 0.98
    INS: 0.98
    DEL: 0.995
  neural_rescue_min_payload_prob: 0.95
  rule_negative_veto: true
  neighbor_abstention: true
  neighbor_radius: 1
  neighbor_min_fraction: 0.90
  homopolymer_del_min_fraction: 0.95
  use_support_payload_for_insertions: true

external_baselines: []
