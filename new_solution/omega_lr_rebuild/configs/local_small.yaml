name: local_small
dataset:
  kind: aligned_bam
  sample_id: UTI89
  bam_path: /Users/shanejayasundera/LRS-Error-Correction/old_solution/data/real_uti89_small/aligned.sorted.bam
  reference_fasta: /Users/shanejayasundera/LRS-Error-Correction/old_solution/data/raw/uti89/reference.fna
  truth_fasta: /Users/shanejayasundera/LRS-Error-Correction/old_solution/data/raw/uti89/reference.fna
  output_dir: outputs/local_small/dataset
  contigs: []
  max_examples: 600
  min_read_length: 1000
  max_window_length: 256
  overlap: 64
  max_support_reads: 8
  max_deletion_length: 5
model:
  target_only:
    use_support: false
  full:
    use_support: true
  d_model: 48
  conv_kernel_size: 5
  support_hidden_dim: 48
train:
  output_dir: outputs/local_small
  epochs: 5
  batch_size: 4
  lr: 0.001
  patience: 2
  encourage_edits_schedule:
    warmup_epochs: 2
    early_false_positive_penalty_weight: 0.03
    late_false_positive_penalty_weight: 0.20
    early_copy_to_sub_penalty_weight: 0.00
    late_copy_to_sub_penalty_weight: 0.50
    early_copy_to_del_penalty_weight: 0.00
    late_copy_to_del_penalty_weight: 0.75
    early_copy_to_ins_penalty_weight: 0.00
    late_copy_to_ins_penalty_weight: 0.50
    early_positive_hard_edit_reward_weight: 0.80
    late_positive_hard_edit_reward_weight: 0.35
    early_gate_open_bias: 1.50
    late_gate_open_bias: 0.00
    early_trust_regularization_weight: 0.00
    late_trust_regularization_weight: 0.00
    early_curriculum_fraction: 0.40
    late_curriculum_fraction: 1.00
    soft_decode_thresholds:
      sub_threshold: 0.20
      del_threshold: 0.20
      ins_threshold: 0.20
      trust_threshold: 0.05
  class_weights:
    COPY: 0.25
    SUB: 2.8
    DEL: 1.1
    INS: 1.8
  delete_candidate_aux_weight: 0.05
  sub_payload_loss_weight: 1.00
  ins_payload_loss_weight: 4.00
  type_margin: 0.50
  type_margin_weight: 0.50
  sub_copy_margin: 1.00
  sub_copy_margin_weight: 1.00
  sub_del_margin: 1.00
  sub_del_margin_weight: 1.00
  ins_del_margin: 0.75
  ins_del_margin_weight: 0.70
  non_del_margin: 0.75
  non_del_margin_weight: 0.60
  del_fallback_penalty_weight: 0.60
  hard_copy_penalty_weight: 0.60
decode:
  sub_threshold: 0.60
  del_threshold: 0.65
  ins_threshold: 0.65
  trust_threshold: 0.55
  max_deletion_length: 5
baseline:
  consensus_agreement_threshold: 0.80
  deletion_threshold: 0.75
